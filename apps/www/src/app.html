<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// 在首屏渲染前应用主题，避免闪一下默认色
			try {
				var t = localStorage.getItem('chess-theme');
				document.documentElement.dataset.theme = ['vermilion','bamboo','indigo','sandalwood','stealth'].includes(t) ? t : 'vermilion';
			} catch (e) {
				document.documentElement.dataset.theme = 'vermilion';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
